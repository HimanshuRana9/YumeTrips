# Application Port configuration (mirrors the MERN port)
server.port=5000

# Database configurations (H2 in-memory — no MySQL required for dev)
spring.datasource.url=jdbc:h2:mem:yumetripsdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


# JWT Configurations (Base64-encoded HMAC key of at least 256 bits)
yume.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
yume.jwt.expiration=86400000

# JSP View Resolver Configuration
spring.mvc.view.prefix=/WEB-INF/jsp/
spring.mvc.view.suffix=.jsp

